# Access Transformer for the Galaxy Comes Alive merged creative tab screen.
#
# GalaxyCreativeScreen (com.lunkoashtail.avaliproject.creativetab.GalaxyCreativeScreen)
# extends the vanilla CreativeModeInventoryScreen so it can reuse all of its item-grid,
# scrolling, drag/drop and search-box behavior instead of reimplementing it. Two members
# used by that subclass are private in vanilla and need to be widened:
#
#   - selectedTab: read to know whether OUR merged tab is the one currently on screen,
#     so the category sidebar only shows/filters while browsing it.
#   - refreshSearchResults(): called after a sidebar category button is clicked to make
#     vanilla rebuild the item list (respecting any typed search text) before we narrow
#     it down to the selected category's item tag.
public net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen selectedTab
public net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen refreshSearchResults()V

# Access Transformer for ShrapnelMinigameScreen (com.lunkoashtail.avaliproject.screen.custom).
#
# GuiGraphics#blit(ResourceLocation, ...) (the public overload) always routes through the
# package-private innerBlit(ResourceLocation, x1, x2, y1, y2, blitOffset, minU, maxU, minV, maxV)
# overload, which uses getPositionTexShader (no per-vertex color, no blending enabled) - so
# GuiGraphics#setColor(r, g, b, a) called beforehand has no visible effect on it at all: neither
# translucency (expie_paw/expie_grip) nor the shrapnel held/idle tint actually rendered. The
# sibling 14-arg innerBlit overload (with explicit red/green/blue/alpha) uses
# getPositionTexColorShader and wraps the draw in enableBlend()/disableBlend(), which is what's
# actually needed - widened here so it can be called directly instead.
public net.minecraft.client.gui.GuiGraphics innerBlit(Lnet/minecraft/resources/ResourceLocation;IIIIIFFFFFFFF)V
